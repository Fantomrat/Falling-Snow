name: build-and-release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip Gradle build step'
        required: false
        default: 'false'
      skip_publish:
        description: 'Skip Github publish'
        required: false
        default: 'false'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: ./gradlew build

      - name: Download prebuilt jars
        if: ${{ github.event.inputs.skip_build == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: versions/*/build/libs/

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Modrinth CLI
        run: npm install -g @modrinth/modrinth

      - name: Create GitHub Release and upload assets
        if: ${{ github.event.inputs.skip_publish != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            versions/*/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: versions/*/build/libs/*.jar

      - name: Publish all jars to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          ./gradlew publishMods \
              -PMODRINTH_TOKEN="$MODRINTH_TOKEN" \
              -PCURSEFORGE_TOKEN="$CURSEFORGE_TOKEN" \
              -PreleaseChangelog="${{ github.event.release.body }}" \
              --console=plain